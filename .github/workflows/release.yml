name: Release

# Собирает релиз для Apple Silicon (arm64) и DMG. Запускается по тегу v* или вручную.
#
# Подпись: сертификата «DOKA Dev» на раннере нет, поэтому build.sh уходит в свою
# ad-hoc-ветку. Для чужого Mac разницы нет — ни ad-hoc, ни самоподписанный
# сертификат Gatekeeper не устраивают, нотаризация требует Apple Developer Program.
# Поэтому релиз создаётся ЧЕРНОВИКОМ: публикует его человек, осознанно.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Сборка DMG
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: DOKA-app

    steps:
      - uses: actions/checkout@v4

      - name: Кеш зависимостей SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('DOKA-app/Package.resolved', 'DOKA-app/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Сборка приложения и образа
        # DOKA_INSTALL_DIR уводит установку из ~/Applications во временный каталог.
        # Сам DMG build.sh кладёт в КОРЕНЬ репозитория, а не в DOKA-app.
        run: DOKA_INSTALL_DIR="$RUNNER_TEMP/out" ./build.sh --dmg

      - name: Проверка встраивания llama.framework
        # Движок локального ИИ-анализа — динамический фреймворк в
        # Contents/Frameworks. Три вещи, которые ломаются молча и всплывают
        # только при запуске у пользователя: срез не arm64, потерянный
        # rpath и неподписанный (или «мусорный») вложенный бандл.
        run: |
          APP="$RUNNER_TEMP/out/DOKA.app"
          FW="$APP/Contents/Frameworks/llama.framework"
          test -d "$FW" || { echo "::error::llama.framework не попал в бандл"; exit 1; }
          archs="$(lipo -archs "$FW/Versions/A/llama")"
          echo "llama.framework: $archs"
          [[ "$archs" == "arm64" ]] \
            || { echo "::error::llama.framework не arm64: $archs"; exit 1; }
          bin_archs="$(lipo -archs "$APP/Contents/MacOS/DOKA")"
          [[ "$bin_archs" == "arm64" ]] \
            || { echo "::error::бинарник не arm64: $bin_archs"; exit 1; }
          otool -L "$APP/Contents/MacOS/DOKA" | grep "llama.framework" >/dev/null \
            || { echo "::error::бинарник не слинкован с llama.framework"; exit 1; }
          # `grep >/dev/null`, а не `grep -q`: с -q otool получает SIGPIPE,
          # и pipefail объявляет успешный поиск неудачей.
          otool -l "$APP/Contents/MacOS/DOKA" | grep "@executable_path/../Frameworks" >/dev/null \
            || { echo "::error::потерян rpath @executable_path/../Frameworks"; exit 1; }
          # Пометка SDK: «собранному под 15» AppKit даёт старый вид контролов
          # и кнопок окна на macOS 26+ (build.sh переписывает её через vtool).
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          otool -l "$APP/Contents/MacOS/DOKA" | grep -E "^ +sdk $sdk$" >/dev/null \
            || { echo "::error::в бинарнике не sdk $sdk — старый вид контролов"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Проверка образа
        working-directory: ${{ github.workspace }}
        run: |
          ls -lh DOKA.dmg
          hdiutil verify DOKA.dmg

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: DOKA-dmg
          path: DOKA.dmg
          if-no-files-found: error

      - name: Черновик релиза
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          ## Установка

          Скачайте `DOKA.dmg`, откройте и перетащите DOKA в «Программы».

          **Первый запуск.** Образ не нотаризован Apple, поэтому macOS покажет, что
          разработчик не подтверждён. Откройте «Системные настройки» →
          «Конфиденциальность и безопасность» → «Открыть всё равно».

          После запуска приложение попросит доступ к **микрофону** и
          **универсальному доступу** — первый нужен для записи, второй для вставки текста.

          ## Требования

          Mac с чипом Apple (M1 и новее), macOS 15 (Sequoia) или новее.
          Mac с процессором Intel не поддерживаются.
          EOF
          gh release create "${GITHUB_REF_NAME}" DOKA.dmg \
            --draft \
            --title "DOKA for macOS ${GITHUB_REF_NAME}" \
            --notes-file notes.md
